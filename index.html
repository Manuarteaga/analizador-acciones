<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Análisis Bursátil</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --green: #22c55e;
            --yellow: #eab308;
            --red: #ef4444;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h1 { font-size: 1.5rem; text-align: center; margin-bottom: 8px; color: var(--accent); }
        p.subtitle { text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 0; margin-bottom: 24px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 10px 12px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 8px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #0f172a;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        
        .results {
            margin-top: 24px;
            border-top: 1px solid #334155;
            padding-top: 20px;
            display: none;
        }
        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.9rem;
        }
        .score-box {
            text-align: center;
            background: #0f172a;
            padding: 16px;
            border-radius: 12px;
            margin-top: 16px;
        }
        .score-value { font-size: 2rem; font-weight: bold; color: var(--accent); }
        .verdict {
            margin-top: 12px;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
        }
        .buy { background: rgba(34, 197, 94, 0.2); color: var(--green); border: 1px solid var(--green); }
        .hold { background: rgba(234, 179, 8, 0.2); color: var(--yellow); border: 1px solid var(--yellow); }
        .sell { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    </style>
</head>
<body>

<div class="container">
    <h1>Analizador Bursátil</h1>
    <p class="subtitle">Panel de evaluación cuantitativa de activos</p>

    <div class="form-group">
        <label>Nombre de la Acción / Ticker</label>
        <input type="text" id="stockName" placeholder="Ej: Inditex, Microsoft...">
    </div>

    <div class="form-group">
        <label>Tipo de Empresa</label>
        <select id="stockType" onchange="toggleFields()">
            <option value="dividend">Enfoque Dividendo (5 parámetros)</option>
            <option value="growth">Empresa Crecimiento / Sin Dividendo (5 parámetros)</option>
        </select>
    </div>

    <!-- Campos Dividendo -->
    <div id="divFields">
        <div class="form-group">
            <label>1. PER (Valoración)</label>
            <select id="perDiv">
                <option value="1">Bajo / Atractivo (<10) [1 pto]</option>
                <option value="0.5" selected>Razonable / Medio (10-25) [0.5 ptos]</option>
                <option value="0">Elevado / Burbuja (>25) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>2. BETA (Volatilidad)</label>
            <select id="betaDiv">
                <option value="1" selected>Estable (<1) [1 pto]</option>
                <option value="0.5">Neutral (=1) [0.5 ptos]</option>
                <option value="0">Volátil (>1) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>3. Rentabilidad por Dividendo</label>
            <select id="yieldDiv">
                <option value="1">Óptima (3% - 5%) [1 pto]</option>
                <option value="0.5" selected>Moderada o Alta riesgosa (1%-3% o 5%-9%) [0.5 ptos]</option>
                <option value="0">Extrema / Impagable (>9% o 0%) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>4. Payout</label>
            <select id="payoutDiv">
                <option value="1" selected>Saludable (35% - 70%) [1 pto]</option>
                <option value="0.5">Bajo o tenso (<35% o >70%) [0.5 ptos / 0]</option>
            </select>
        </div>
        <div class="form-group">
            <label>5. Crecimiento del Dividendo</label>
            <select id="growthDiv">
                <option value="1" selected>Sólido por encima de inflación [1 pto]</option>
                <option value="0.5">Estable / Plano [0.5 ptos]</option>
                <option value="0">Errático / Recorte [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>Racha (Años seguidos sin recortar)</label>
            <input type="text" id="streakDiv" placeholder="Ej: 25 años, Aristócrata, Reciente...">
        </div>
    </div>

    <!-- Campos Crecimiento -->
    <div id="growthFields" style="display: none;">
        <div class="form-group">
            <label>1. Eficiencia de Capital (ROIC / ROE)</label>
            <select id="roicGrowth">
                <option value="1" selected>Excelente (>15-20%) [1 pto]</option>
                <option value="0.5">Aceptable (8-15%) [0.5 ptos]</option>
                <option value="0">Bajo / Destruye valor (<8%) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>2. Crecimiento (CAGR Ingresos/BPA)</label>
            <select id="cagrGrowth">
                <option value="1" selected>Alto crecimiento (>15%) [1 pto]</option>
                <option value="0.5">Moderado (5-15%) [0.5 ptos]</option>
                <option value="0">Plano / Decreciente [<5%) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>3. Solvencia (Deuda Neta / EBITDA)</label>
            <select id="debtGrowth">
                <option value="1" selected>Caja neta / Deuda < 1x [1 pto]</option>
                <option value="0.5">Saludable (1x - 2.5x) [0.5 ptos]</option>
                <option value="0.5">Elevada (>2.5x) [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>4. Generación de Caja Libre (FCF)</label>
            <select id="fcfGrowth">
                <option value="1" selected>Alta conversión / FCF robusto [1 pto]</option>
                <option value="0.5">Estándar / Neutro [0.5 ptos]</option>
                <option value="0">Quema caja / Negativo [0 ptos]</option>
            </select>
        </div>
        <div class="form-group">
            <label>5. Moat / Asignación de Capital</label>
            <select id="moatGrowth">
                <option value="1" selected>Foso ancho / Excelente gestión [1 pto]</option>
                <option value="0.5">Correcto / Sin destacar [0.5 ptos]</option>
                <option value="0">Sin foso / Mala asignación [0 ptos]</option>
            </select>
        </div>
    </div>

    <button onclick="calculateScore()">Calcular Puntuación</button>

    <div class="results" id="resultsPanel">
        <h3 id="resTitle" style="margin-top:0; text-align:center;">Resultado</h3>
        <div class="score-box">
            <div>Puntuación Final</div>
            <div class="score-value" id="resScore">0.0 / 5</div>
        </div>
        <div id="resVerdict" class="verdict"></div>
    </div>
</div>

<script>
function toggleFields() {
    const type = document.getElementById('stockType').value;
    if (type === 'dividend') {
        document.getElementById('divFields').style.display = 'block';
        document.getElementById('growthFields').style.display = 'none';
    } else {
        document.getElementById('divFields').style.display = 'none';
        document.getElementById('growthFields').style.display = 'block';
    }
}

function calculateScore() {
    const name = document.getElementById('stockName').value || 'Activo';
    const type = document.getElementById('stockType').value;
    let total = 0;

    if (type === 'dividend') {
        total += parseFloat(document.getElementById('perDiv').value);
        total += parseFloat(document.getElementById('betaDiv').value);
        total += parseFloat(document.getElementById('yieldDiv').value);
        total += parseFloat(document.getElementById('payoutDiv').value);
        total += parseFloat(document.getElementById('growthDiv').value);
    } else {
        total += parseFloat(document.getElementById('roicGrowth').value);
        total += parseFloat(document.getElementById('cagrGrowth').value);
        total += parseFloat(document.getElementById('debtGrowth').value);
        total += parseFloat(document.getElementById('fcfGrowth').value);
        total += parseFloat(document.getElementById('moatGrowth').value);
    }

    document.getElementById('resTitle').innerText = `Informe para: ${name}`;
    document.getElementById('resScore').innerText = `${total.toFixed(1)} / 5`;

    const verdictEl = document.getElementById('resVerdict');
    verdictEl.className = 'verdict';

    if (total >= 4.0) {
        verdictEl.innerText = '🟢 COMPRAR (Nota excelente / Sólidos fundamentales)';
        verdictEl.classList.add('buy');
    } else if (total >= 3.0) {
        verdictEl.innerText = '🟡 MANTENER / EN VIGILANCIA (Zona neutral o atractiva con matices)';
        verdictEl.classList.add('hold');
    } else {
        verdictEl.innerText = '🔴 DESCARTAR / VENDER (Baja puntuación en parámetros clave)';
        verdictEl.classList.add('sell');
    }

    document.getElementById('resultsPanel').style.display = 'block';
}
</script>

</body>
</html>
